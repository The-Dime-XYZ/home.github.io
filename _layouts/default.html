<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE DIME</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
   <!-- Navigation -->
   <nav class="navbar navbar-expand-lg fixed-top" id="mainNavbar">
     <div class="container">
       <a class="navbar-brand" href="#">
         <img src="{{ '/assets/images/logo_white.png' | relative_url }}" alt="THE DIME Logo" height="40" class="d-inline-block align-text-top" style="filter: brightness(0) invert(1);">
       </a>
       <div class="navbar-nav ms-auto">
         <a class="nav-link text-white px-3 py-2" href="#" style="font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; text-decoration: none;">Coming Soon</a>
       </div>
     </div>
   </nav>

   {{ content }}

   <!-- Bootstrap JS Bundle -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
   
   <!-- Custom JavaScript for navbar scroll effect -->
   <script>
     window.addEventListener('scroll', function() {
       const navbar = document.getElementById('mainNavbar');
       if (window.scrollY > 50) {
         navbar.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
         navbar.style.backdropFilter = 'blur(10px)';
       } else {
         navbar.style.backgroundColor = 'transparent';
         navbar.style.backdropFilter = 'none';
       }
     });
   </script>
</body>
</html>
